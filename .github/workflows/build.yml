name: Build, Test & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published stable release tag to retry on NuGet.org (for example, v2.1.0)'
        required: true
        type: string
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]
    
env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Set the build number in MinVer.
  MINVERBUILDMETADATA: build.${{github.run_number}}

jobs:
  test:
    name: Test-${{matrix.os}}
    if: github.event_name == 'pull_request'
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore
    - name: Test
      run: dotnet test
      
  build:
    name: Build Package
    if: >-
      github.event_name == 'push' || github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
    - name: Verify release for manual retry
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
          throw 'Enter a stable release tag such as v2.1.0.'
        }
        $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,publishedAt | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0 -or $release.tagName -cne $env:RELEASE_TAG -or
            $release.isDraft -or $release.isPrerelease -or -not $release.publishedAt) {
          throw "Release '$env:RELEASE_TAG' must be a published stable release in this repository."
        }
      shell: pwsh
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || '' }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore
    - name: Pack
      run: dotnet pack -c Release --output nupkgs --no-build
    - name: Publish Artifacts
      uses: actions/upload-artifact@v7.0.2
      with:
        name: "windows-latest"
        path: "./nupkgs/*.nupkg"

  push-github:
    name: Push GitHub Package
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'release'
    environment:
      name: "GitHub"
      url: https://github.com/${{ github.repository }}/packages
    permissions:
      packages: write
    runs-on: windows-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: "windows-latest"
      - name: Dotnet NuGet Add Source
        run: dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name github --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
      - name: Dotnet NuGet Push
        run: dotnet nuget push *.nupkg --api-key ${{ secrets.GH_PACKAGES_TOKEN }} --source github --skip-duplicate
        shell: pwsh
        
  push-nuget:
    name: Push NuGet Package
    needs: build
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      github.event_name == 'workflow_dispatch'
    environment:
      name: "NuGet"
      url: https://www.nuget.org/packages/Tailwind.MSBuild
    permissions:
      id-token: write
    runs-on: windows-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: "windows-latest"
      - name: NuGet Trusted Publishing login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: MJRasicci
      - name: Dotnet NuGet Push
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Expected a stable release tag, got '$env:RELEASE_TAG'."
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $package = Get-Item -LiteralPath "Tailwind.MSBuild.$version.nupkg" -ErrorAction Stop
          dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key $env:NUGET_API_KEY
        shell: pwsh
