name: Build, Test & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published release tag to recover on NuGet.org (v2.1.0 or v2.2.0-preview.1)'
        required: true
        type: string
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Set assembly informational metadata; this does not change package identity.
  MINVERBUILDMETADATA: build.${{github.run_number}}

# Builds and tests do not receive publishing permissions.
permissions:
  contents: read

jobs:
  prepare:
    name: Validate Build Source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      should_run: ${{ steps.source.outputs.should_run }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      # For manual recovery this is main's workflow revision, not the release tag.
      - name: Checkout workflow revision
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Test release safeguards
        run: ./.github/scripts/Test-ReleasePreparation.ps1
        shell: pwsh
      - name: Validate source and publication
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: >-
          ./.github/scripts/Resolve-Release.ps1
          -EventName $env:EVENT_NAME -EventRef $env:EVENT_REF
          -EventSha $env:EVENT_SHA -ReleaseTag $env:RELEASE_TAG
        shell: pwsh

  test:
    name: Test-${{matrix.os}}
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ needs.prepare.outputs.source_sha }}
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore
    - name: Test
      run: dotnet test -c Release --no-build --no-restore

  build:
    name: Build Package
    needs: [prepare, test]
    if: needs.prepare.outputs.should_run == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ needs.prepare.outputs.source_sha }}
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore
    - name: Pack
      run: dotnet pack -c Release --output nupkgs --no-build
    - name: Verify release package version
      if: needs.prepare.outputs.publish == 'true'
      env:
        RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        $packages = @(Get-ChildItem -LiteralPath nupkgs -Filter '*.nupkg')
        if ($packages.Count -ne 1 -or $packages[0].Name -cne "Tailwind.MSBuild.$env:RELEASE_VERSION.nupkg") {
          throw 'MinVer package version does not match the selected release tag. Nothing will be published.'
        }
        $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
        try {
          $entry = $archive.GetEntry('Tailwind.MSBuild.nuspec')
          if ($null -eq $entry) { throw 'The release package is missing its expected nuspec.' }
          $reader = [System.IO.StreamReader]::new($entry.Open())
          try { [xml] $manifest = $reader.ReadToEnd() }
          finally { $reader.Dispose() }
          if ($manifest.package.metadata.id -cne 'Tailwind.MSBuild' -or
              $manifest.package.metadata.version -cne $env:RELEASE_VERSION) {
            throw 'The package manifest does not match the selected release version.'
          }
        }
        finally { $archive.Dispose() }
      shell: pwsh
    - name: Publish Artifacts
      uses: actions/upload-artifact@v7.0.2
      with:
        name: "windows-latest"
        path: "./nupkgs/*.nupkg"
        if-no-files-found: error

  push-github:
    name: Push GitHub Package
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'release'
    environment:
      name: "GitHub"
      url: https://github.com/${{ github.repository }}/packages
    permissions:
      packages: write
    runs-on: windows-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: "windows-latest"
      - name: Dotnet NuGet Add Source
        run: dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name github --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
      - name: Dotnet NuGet Push
        run: dotnet nuget push *.nupkg --api-key ${{ secrets.GH_PACKAGES_TOKEN }} --source github --skip-duplicate
        shell: pwsh

  push-nuget:
    name: Push NuGet Package
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    environment:
      name: "NuGet"
      url: https://www.nuget.org/packages/Tailwind.MSBuild
    permissions:
      id-token: write
    runs-on: windows-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: "windows-latest"
      - name: NuGet Trusted Publishing login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: MJRasicci
      - name: Dotnet NuGet Push
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $package = Get-Item -LiteralPath "Tailwind.MSBuild.$env:RELEASE_VERSION.nupkg" -ErrorAction Stop
          # A concurrent publication must fail, never create or increment a version.
          dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
        shell: pwsh
